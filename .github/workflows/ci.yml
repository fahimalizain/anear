name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build
        run: swift build
